<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
</head>
<style>
table, th, td {
  border: 1px solid rgb(240, 232, 232);
  border-collapse: collapse;
}
th, td {
  background-color: #96D4D4;
}
</style>
<body>
    
    <h1>資三乙 陳浡丞 九九乘法表</h1>
    <script>
    document.write("<table align='center'>");
    for (let i = 1; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 1; j <= i ; j++) {
            document.write("<td>");
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
            document.write("</td>");
        } 
        document.write("</tr>");
    }
    document.write("</table>");
</script>
</body>
</html>
